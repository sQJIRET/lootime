<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Правила сервера</title>
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/style.css">
  <style>
    .rules { white-space: normal; }
    .rules p { margin: 0 0 8px; line-height: 1.55; }
    .rules p.gap { margin: 0; height: 4px; }
    .rules p.h { margin: 26px 0 12px; padding-bottom: 8px; border-bottom: 2px solid var(--accent); font-size: 21px; font-weight: 800; }
    .rules p.h:first-child { margin-top: 0; }
    .rules p.note { padding: 12px 14px; border-radius: 12px; background: #fff4f4; border: 1px solid #f6c9cd; color: #17151c; }
    html[data-theme="dark"] .rules p.note { background: #3a1f27; border-color: #6b2b36; color: #ffd9dd; }
  </style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="/"><img class="logo" src="/img/logo.png" alt=""><span id="brand">Магазин</span></a>
    <nav>
      <a href="/" data-nav="home"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg><span>Главная</span></a>
      <a href="/#shop" data-nav="shop"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg><span>Магазин</span></a>
      <a href="/rules" data-nav="rules"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg><span>Правила сервера</span></a>
      <a href="/contacts" data-nav="contacts"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>Контакты</span></a>
      <button type="button" class="theme-btn" id="themeBtn" aria-label="Сменить тему" title="Светлая / тёмная тема"><svg class="ico-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="ico-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    </nav>
  </div>
</header>
<main class="wrap">
  <h1 style="margin-top:36px">Правила сервера</h1>
  <div class="rules" id="rules">Загрузка…</div>
</main>
<script>
  fetch('/api/shop').then((r) => r.json()).then(({ settings }) => {
    document.getElementById('brand').textContent = settings.shop_name;
    document.title = 'Правила — ' + settings.shop_name;
    const box = document.getElementById('rules');
    box.replaceChildren();
    const lines = String(settings.rules).split('\n');
    for (let i = 0; i < lines.length; i++) {
      const t = lines[i].trim();
      if (/^\d+\.\d+\s+(Список программ|Полный список)/.test(t)) {
        const d = document.createElement('details');
        d.className = 'proglist';
        const sm = document.createElement('summary');
        sm.textContent = t.replace(/:$/, '');
        d.append(sm);
        while (i + 1 < lines.length && lines[i + 1].trim()) {
          i++;
          const q = document.createElement('p');
          q.textContent = lines[i].trim();
          if (/^Важно!/.test(q.textContent)) q.className = 'note';
          else if (/^[^•:]{3,40}:$/.test(q.textContent)) q.className = 'sub';
          d.append(q);
        }
        box.append(d);
        continue;
      }
      const p = document.createElement('p');
      if (!t) { p.className = 'gap'; }
      else if (/^\d+\.\s/.test(t)) { p.className = 'h'; p.textContent = t.replace(/:$/, ''); }
      else if (/^Примечание:/.test(t)) { p.className = 'note'; p.textContent = t; }
      else { p.textContent = t; }
      box.append(p);
    }
    const code = document.createElement('p');
    code.className = 'note';
    code.textContent = 'Кодовое слово: Квалификация';
    box.append(code);
  }).catch(() => { document.getElementById('rules').textContent = 'Не удалось загрузить правила.'; });
</script>
<script>
document.querySelectorAll('.ip-chip').forEach(function(b){b.addEventListener('click',function(){
  var ip=b.dataset.ip;
  function done(){b.classList.add('copied');setTimeout(function(){b.classList.remove('copied')},1500)}
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(ip).then(done,fallback)}else fallback();
  function fallback(){var t=document.createElement('textarea');t.value=ip;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();try{document.execCommand('copy')}catch(e){}t.remove();done()}
})});
</script>
<script src="/footer.js"></script>
</body>
</html>
